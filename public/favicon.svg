<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wanderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a5f" />
      <stop offset="100%" stop-color="#fe424d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="100" height="100" rx="24" fill="url(#wanderGrad)" />

  <!-- Outer compass dial ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="30" fill="rgba(0,0,0,0.06)" />

  <!-- Cardinal tick marks -->
  <line x1="50" y1="18" x2="50" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="78" x2="50" y2="82" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="18" y1="50" x2="22" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="78" y1="50" x2="82" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- 45-degree Angled Compass Needle -->
  <g transform="rotate(45 50 50)" filter="url(#shadow)">
    <!-- North Needle (white / silver facets) -->
    <polygon points="50,50 43,50 50,22" fill="#ffffff" />
    <polygon points="50,50 57,50 50,22" fill="#e2e8f0" />

    <!-- South Needle (dark slate facets) -->
    <polygon points="50,50 43,50 50,78" fill="#64748b" />
    <polygon points="50,50 57,50 50,78" fill="#334155" />

    <!-- Pivot Center -->
    <circle cx="50" cy="50" r="5" fill="#ffffff" />
    <circle cx="50" cy="50" r="2.5" fill="#fe424d" />
  </g>
</svg>
